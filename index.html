<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Game Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,Segoe UI,Roboto;
  background:radial-gradient(circle at top,#1f2937,#020617);
  color:white;
  min-height:100vh;
}

  .app:hover .label{
  opacity:1;
}
  
header{text-align:center;padding:25px}
header h1{font-size:2.2em}
header p{opacity:.7;margin-top:6px}

.controls{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:10px;
}

input,select{
  padding:10px 14px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
  gap:28px;
  padding:30px;
  max-width:950px;
  margin:auto;
}

.app{
  text-align:center;
  cursor:pointer;
  width:90px;
  margin:auto;
}


.icon{
  width:76px;height:76px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
  transition:.25s ease;
}

.icon .material-icons{font-size:36px}

.app:hover .icon{
  transform:scale(1.12);
  box-shadow:0 18px 40px rgba(0,0,0,.7);
}

.label{
  margin-top:8px;
  font-size:13px;
  opacity:.9;
  text-align:center;
  line-height:1.2;
  max-width:90px;
  white-space:normal;
  word-wrap:break-word;
}

footer{text-align:center;padding:15px;opacity:.5;font-size:13px}
</style>
</head>

<body>

<header>
<h1>🎮 Game Launcher</h1>
<p>Demande plus de sites a Yanis :)</p>
</header>

<div class="controls">
  <input id="search" placeholder="🔍 Rechercher un jeu">
  <select id="category">
    <option value="all">Tout</option>
    <option value="arcade">Arcade</option>
    <option value="action">Action</option>
    <option value="reflexion">Réflexion</option>
    <option value="media">Média</option>
  </select>
</div>

<div class="grid" id="apps"></div>

<footer>Launcher Web Pour Les Gamers Par Un Gamer</footer>

<script>
const games = [
  {name:"CrazyGames",url:"https://www.crazygames.com/fr",icon:"flash_on",cat:"action",color:"#f59e0b"},
  {name:"Miniclip",url:"https://www.miniclip.com/games/fr/",icon:"videogame_asset",cat:"arcade",color:"#22c55e"},
  {name:"Youtube",url:"https://www.youtube.com/",icon:"public",cat:"media",color:"#ef4444"},
  {name:"GeoGuessr",url:"https://www.geoguessr.com/fr",icon:"travel_explore",cat:"reflexion",color:"#3b82f6"},
  {name:"AddictingGames",url:"https://www.addictinggames.com",icon:"videogame_asset",cat:"arcade",color:"#a855f7"},
  {name:"Overtide",url:"https://overtide.io/",icon:"flash_on",cat:"action",color:"#06b6d4"},
  {name:"Minecraft",url:"https://eaglercraft.com/play/?version=1.8.8",icon:"grid_view",cat:"reflexion",color:"#16a34a"},
  {name:"Block Blast",url:"https://blockblastonline.com/",icon:"view_module",cat:"reflexion",color:"#eab308"},
  {name:"Snake",url:"https://www.snake.be/",icon:"favorite",cat:"arcade",color:"#f97316"},
  {name:"GeForce",url:"https://www.nvidia.com/en-eu/geforce-now/",icon:"groups",cat:"action",color:"#7aeba3"},
  {name:"Chess",url:"https://www.chess.com/play/computer",icon:"casino",cat:"reflexion",color:"#e7eb7a"},
  {name:"Subway Surfer",url:"https://subway-surfers.gg/",icon:"train",cat:"action",color:"#ed9077"}
];

const apps=document.getElementById("apps");
const search=document.getElementById("search");
const category=document.getElementById("category");

function render(){
  apps.innerHTML="";
  const s=search.value.toLowerCase();
  const c=category.value;

  games.filter(g=>
    g.name.toLowerCase().includes(s) &&
    (c==="all"||g.cat===c)
  ).forEach(g=>{
    const el=document.createElement("div");
    el.className="app";
    el.onclick=()=>window.open(g.url,"_blank");
    el.innerHTML=`
      <div class="icon" style="background:${g.color}">
        <span class="material-icons">${g.icon}</span>
      </div>
      <div class="label">${g.name}</div>
    `;
    apps.appendChild(el);
  });
}

search.oninput=render;
category.onchange=render;
render();
</script>

</body>
</html>
